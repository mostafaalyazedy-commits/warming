<style>
#wh-studio{--plum:#45234f;--paper:#fbf6f2;--ink:#38263f;font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:#f9f4f0;height:700px;display:flex;flex-direction:column;overflow:hidden;position:relative;font-size:14px;line-height:1.7;isolation:isolate}#wh-studio *{box-sizing:border-box}#wh-studio button,#wh-studio input,#wh-studio select,#wh-studio textarea{font:inherit}#wh-studio button{cursor:pointer}#wh-studio button:focus-visible,#wh-studio a:focus-visible{outline:3px solid #c098d3;outline-offset:4px}#wh-studio button{color:inherit}#wh-studio [hidden]{display:none!important}#wh-studio .topbar{height:76px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 5%;gap:15px;background:var(--paper);border-bottom:1px solid #4b245b10;z-index:5}#wh-studio .wordmark{width:142px;aspect-ratio:3.05;overflow:hidden;position:relative;display:block;mix-blend-mode:multiply}#wh-studio .wordmark img{position:absolute;width:143.125%;max-width:none;left:-21.35%;top:-77.77%;filter:contrast(1.15)}#wh-studio .brand-button{padding:0;background:none;border:0}#wh-studio .top-links{display:flex;align-items:center;gap:25px}#wh-studio .text-button{border:0;background:none;font-size:12px;padding:10px 0}#wh-studio .lang{border:1px solid #cbbcd0;border-radius:50%;width:40px;height:40px;padding:0;font-size:11px;background:transparent}#wh-studio .stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#2c1738;perspective:1500px}#wh-studio .screen{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#b49ac1 transparent;display:flex;flex-direction:column;background:var(--paper)}#wh-studio .chapter-bar{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 5% 5px;flex:none}#wh-studio .back{border:0;background:transparent;padding:7px 0;font-size:12px;display:flex;gap:10px;align-items:center}#wh-studio .chapter-no{font-size:10px;letter-spacing:2px;opacity:.6;direction:ltr} tudio .patch-demo{width:180px;height:125px;border-radius:24px;background:repeating-linear-gradient(0deg,#fff9 0px,#fff9 2px,#e3d8e5 3px);box-shadow:0 15px 25px #4b245b20;position:relative;transform:rotate(-9deg)}#wh-studio .patch-demo:after{content:'';position:absolute;right:-10px;top:-12px;width:75px;height:75px;border-radius:4px 15px 4px 70px;background:linear-gradient(135deg,#fdfaff,#d9c9e2);box-shadow:-5px 7px 10px #62437722;transform:rotate(12deg)}#wh-studio .apply-demo{width:220px;height:190px;position:relative;background:#bea0ce;clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);border-radius:45% 45% 20% 20%}#wh-studio .apply-demo:before{content:'';position:absolute;bottom:15px;left:30px;right:30px;height:90px;background:#ede2f2;border-radius:15px 15px 55% 55%;border-top:4px solid #faf4fd}#wh-studio .apply-demo:after{content:'';position:absolute;bottom:48px;width:75px;height:45px;left:72px;background:#fffaf9;border-radius:10px;box-shadow:0 0 35px #d5ae7eaa}#wh-studio .hours-demo{font:110px Georgia,serif;color:#684079;position:relative;line-height:1.1}#wh-studio .hours-demo small{font:22px Georgia,serif}#wh-studio .visual-note{font-size:10px;color:#977a9f;position:absolute;bottom:0}

bottom:7px}#wh-studio .answer-card h3{font-size:14px;margin-bottom:8px}#wh-studio .answer-card p{font-size:12px}#wh-studio .contact-layout{grid-template-columns:1fr;gap:18px;height:auto}#wh-studio .contact-channels{grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}#wh-studio .channel{font-size:11px;padding:10px;display:block}#wh-studio .channel small{display:block;margin-top:2px}#wh-studio .contact-layout .eyebrow{display:none}#wh-studio input,#wh-studio select{padding:8px 10px}#wh-studio textarea{height:60px}#wh-studio .bottom-bar{font-size:8px}}
