<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Warmhug</title>
<meta name="warmhug-build" content="v12.7-release">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Warmhug — لاصقات التدفئة بالأعشاب الطبيعية">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=El+Messiri:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap">
<style>
/* Layout: one screen-high scene. The original box is hero and backdrop; six points on its artwork lead into six worlds.
   The journey keeps the pressed point as its centre: the box moves past the camera, the world grows out of that point,
   and one element (a ring, or the box itself) travels from the scene into the world. */
:root{
  /* palette sampled from the packaging */
  --night:#1f1324;      /* deepest plum, under the box */
  --plum:#2e1c36;       /* box base plum, darkened */
  --violet:#6d4782;     /* dress / box mid tone */
  --lilac:#c9bfdc;      /* box top lilac */
  --lilac-soft:#e7e1ef;
  --paper:#fbf6f2;      /* original cream */
  --white:#fffdfa;
  --ink:#2b1b31;
  --ink-2:#5d4a66;
  --gold:#d9c39a;       /* hairline gold from the original */
  --ember:#e7ad9d;      /* the warm patch on the box illustration */
  --ember-deep:#b8614c;
  --alert:#9b3626;

  /* fallbacks chosen for Arabic first, then Latin, so the page reads well if Google Fonts cannot load */
  --f-ar-display:"El Messiri","Noto Kufi Arabic","Noto Sans Arabic","Geeza Pro","Segoe UI","Tahoma",sans-serif;
  --f-body:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI","Geeza Pro","Tahoma",system-ui,-apple-system,sans-serif;
  --f-latin:"Cormorant Garamond","Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --f-display:var(--f-ar-display);

  --ease-out:cubic-bezier(.16,.84,.24,1);
  --bar-h:60px;
  color-scheme:dark;
}
:root[lang="en"]{--f-display:var(--f-latin)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow:hidden;
  --bar-fg:var(--paper);--bar-bg:transparent;--bar-line:transparent}
body[data-tone="light"]{--bar-fg:var(--ink);--bar-bg:var(--paper);--bar-line:rgba(43,27,49,.12)}
body[data-tone="white"]{--bar-fg:var(--ink);--bar-bg:var(--white);--bar-line:rgba(43,27,49,.12)}
body[data-tone="lilac"]{--bar-fg:var(--ink);--bar-bg:var(--lilac);--bar-line:rgba(43,27,49,.14)}
body[data-tone="dark"]{--bar-fg:var(--paper);--bar-bg:var(--plum);--bar-line:rgba(251,246,242,.1)}
body[data-tone="night"]{--bar-fg:var(--paper);--bar-bg:var(--night);--bar-line:rgba(251,246,242,.1)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bar-bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:2px}
.world:not(.dark) :focus-visible{outline-color:var(--violet)}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--f-latin);font-variant-numeric:lining-nums tabular-nums;letter-spacing:.02em}
.step-no,.specs b,.eight .big,.qno,.ill .dial-num,.kicker .num,.crumb .num{font-variant-numeric:lining-nums}

/* ───────── top bar ───────── */
.bar{position:fixed;inset:0 0 auto;z-index:50;height:calc(var(--bar-h) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:14px;color:var(--bar-fg);background:var(--bar-bg);border-bottom:1px solid var(--bar-line);
  transition:background-color .35s ease,color .35s ease,border-color .35s ease}
.brand{display:block;width:108px;height:36px;color:currentColor}
.brand i{display:block;width:100%;height:100%;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.back{display:inline-flex;align-items:center;gap:8px;height:44px;padding-inline:14px 10px;font-size:14px;border-inline-start:1px solid color-mix(in srgb,currentColor 25%,transparent)}
.back svg{width:18px;height:18px;transition:transform .25s var(--ease-out)}
[dir="rtl"] .back svg{transform:scaleX(-1)}
.back:hover svg{transform:translateX(-3px)}
[dir="rtl"] .back:hover svg{transform:scaleX(-1) translateX(-3px)}
.crumb{font-size:13px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb .num{font-size:16px;margin-inline-end:6px}
.bar nav{margin-inline-start:auto;display:flex;align-items:center;gap:4px}
.bar nav button{height:44px;padding-inline:12px;font-size:14px;position:relative}
.bar nav button::after{content:"";position:absolute;inset-inline:12px;bottom:9px;height:1px;background:currentColor;transform:scaleX(0);transition:transform .25s var(--ease-out)}
.bar nav button:hover::after{transform:scaleX(1)}
#lang{font-family:var(--f-latin);font-size:17px;border:1px solid color-mix(in srgb,currentColor 35%,transparent);border-radius:22px;min-width:54px;height:40px}
#lang[data-to="ar"]{font-family:var(--f-ar-display);font-size:15px}
#lang::after{display:none}

/* ───────── layers ───────── */
.layer{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.layer.off{visibility:hidden}
.world{z-index:20}
.home{z-index:10;background:var(--night)}
.moving .layer{scrollbar-width:none;pointer-events:none}
.ghost{position:fixed;z-index:45;pointer-events:none;border:1.5px solid var(--gold);border-radius:50%;box-sizing:border-box}
.ghost-img{position:fixed;z-index:45;pointer-events:none;transform-origin:0 0;max-width:none}

/* ───────── home scene ───────── */
.atmo{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.atmo i{position:absolute;inset:0;background:var(--atmo) 50% 45%/cover no-repeat;opacity:.42}
.atmo::before{content:"";position:absolute;inset:0;z-index:1;background:
  radial-gradient(60% 55% at 42% 62%,rgba(231,173,157,.18),transparent 70%),
  linear-gradient(180deg,rgba(31,19,36,.55),rgba(31,19,36,.15) 40%,rgba(31,19,36,.85))}

.scene{position:relative;z-index:3;min-height:100%;padding-top:calc(var(--bar-h) + env(safe-area-inset-top,0px))}
.intro h1{font-family:var(--f-display);font-weight:500;line-height:1.08;margin:0;text-wrap:balance}
:root[lang="en"] .intro h1{font-weight:400;letter-spacing:-.01em}
.intro p{margin:12px 0 0;color:var(--lilac);font-size:15px;max-width:32ch}
.facts{display:flex;flex-wrap:wrap;gap:4px 0;margin:18px 0 0;padding:0;list-style:none;font-size:13px;color:color-mix(in srgb,var(--paper) 78%,transparent)}
.facts li{display:flex;align-items:center}
.facts li+li::before{content:"";width:3px;height:3px;border-radius:50%;background:var(--gold);margin-inline:10px}
.hint{font-size:12.5px;color:color-mix(in srgb,var(--paper) 58%,transparent);margin:0}
.hint svg{width:14px;height:14px;vertical-align:-2px;margin-inline-end:6px;color:var(--gold)}

/* the box: .box is the frame of the pack itself; .shot is the full photo positioned so its pack fills .box */
.box{position:relative;aspect-ratio:.717;max-width:100%}
.boxin{position:absolute;inset:0}
.box .shot{position:absolute;width:143.3%;max-width:none;left:-18.77%;top:-12.88%;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none;
  filter:drop-shadow(0 34px 44px rgba(15,8,18,.45))}
.box .shot.in{animation:arrive 1.1s var(--ease-out) both}
@keyframes arrive{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}

/* hotspots (desktop: dot + hairline + label) */
.spot{position:absolute;height:0;top:calc(var(--y)*100%);display:block;color:var(--paper);text-align:start}
.spot[data-side="L"]{left:calc(-1 * var(--gap));width:calc(var(--x)*100% + var(--gap));--dir:to right;--from:right;--nudge:-4px}
.spot[data-side="R"]{left:calc(var(--x)*100%);width:calc((1 - var(--x))*100% + var(--gap));--dir:to left;--from:left;--nudge:4px}
.spot .rule{position:absolute;inset-inline:0;top:0;height:1px;background:linear-gradient(var(--dir),rgba(217,195,154,.95),rgba(217,195,154,.55));transform-origin:var(--from) 50%}
.spot .dot{position:absolute;top:0;width:44px;height:44px;margin:-22px;display:grid;place-items:center}
.spot[data-side="L"] .dot{right:0}
.spot[data-side="R"] .dot{left:0}
.dot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 1px rgba(31,19,36,.35)}
.dot::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;border:1px solid var(--paper);transition:transform .3s var(--ease-out),border-color .2s,background-color .2s}
.dot b{position:absolute;font:600 12.5px/1 var(--f-body);color:var(--night);opacity:0;font-variant-numeric:lining-nums}
.spot .tag{position:absolute;top:0;transform:translateY(-50%);display:flex;align-items:baseline;gap:10px;white-space:nowrap;padding-block:10px;transition:transform .3s var(--ease-out)}
.spot[data-side="L"] .tag{right:calc(100% + 14px);flex-direction:row-reverse}
.spot[data-side="R"] .tag{left:calc(100% + 14px)}
[dir="rtl"] .spot[data-side="L"] .tag{flex-direction:row}
[dir="rtl"] .spot[data-side="R"] .tag{flex-direction:row-reverse}
.tag .num{font-size:15px;color:var(--gold)}
.tag .nm{font-family:var(--f-display);font-size:19px;font-weight:500;line-height:1.2}
:root[lang="en"] .tag .nm{font-size:22px}
.spot:hover .dot::after,.spot:focus-visible .dot::after,.spot.hot .dot::after{transform:scale(1.65);border-color:var(--gold);background:rgba(217,195,154,.12)}
.spot:hover .tag,.spot.hot .tag{transform:translateY(-50%) translateX(var(--nudge))}
.spot:focus-visible{outline:none}
.spot:focus-visible .tag{outline:2px solid var(--gold);outline-offset:4px}
.spot.pressed .dot::after{transform:scale(2.1);border-color:var(--ember);transition-duration:.12s}
.spot.launch .dot{opacity:0}
.box .spot.enter-in .rule{animation:draw .8s var(--ease-out) both;animation-delay:var(--d)}
.box .spot.enter-in .tag,.box .spot.enter-in .dot{animation:fadein .6s ease both;animation-delay:calc(var(--d) + .2s)}
@keyframes draw{from{transform:scaleX(0)}}
@keyframes fadein{from{opacity:0}}

.index{display:none}
.facts-m{display:none}
@media (max-width:599.98px){ .crumb{display:none} .brand{width:96px} .bar{gap:8px} .bar nav button{padding-inline:10px} body[data-tone]:not([data-tone=""]) #nav-contact{display:none} }

/* desktop composition */
@media (min-width:900px){
  .scene{height:100%;min-height:600px;overflow:clip}
  :root{--bh:min(76svh,820px,calc((100vw - 500px)/.717));--cx:50%}
  .box{position:absolute;top:calc(50% + var(--bar-h)/2 - 4px);left:var(--cx);transform:translate(-50%,-50%);height:var(--bh);--gap:44px}
  .intro{position:absolute;top:calc(var(--bar-h) + 22px);inset-inline-start:max(28px,4vw);max-width:300px}
  .intro h1{font-size:32px}
  .intro .facts{display:none}
  .hint{position:absolute;bottom:22px;inset-inline-start:max(28px,4vw)}
}
@media (min-width:1200px){
  :root{--cx:41%;--bh:min(80svh,880px,calc((100vw - 640px)/.717))}
  [dir="ltr"]{--cx:59%}
  .intro{top:50%;transform:translateY(-50%);inset-inline-start:max(48px,5.5vw);max-width:min(25vw,380px)}
  .intro h1{font-size:clamp(44px,4.4vw,78px)}
  .intro .facts{display:flex}
  .intro::before{content:"";display:block;width:44px;height:1px;background:var(--gold);margin-bottom:24px}
}
@media (min-width:900px) and (max-height:700px){ .intro p{display:none} :root{--bh:min(78svh,calc((100vw - 640px)/.717))} }

/* phone & narrow tablet: the pack fills the space under the title; six capsule tabs are clipped onto its two long edges.
   .box is exactly the visible pack (not the photo file), so the tabs stay on the edges at every size. */
.edges{display:none}
@media (max-width:899.98px){
  .scene{overflow:clip;height:100%;min-height:500px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px;
    padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
    padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .intro{padding-top:2px}
  .intro h1{font-size:clamp(25px,7.2vw,38px)}
  .intro p{display:none}
  .intro .facts{display:flex;margin-top:3px;font-size:12.5px}
  .stage{min-height:0;container-type:size;display:grid;place-items:start center}
  /* keep the pack ratio; reserve the tab overhang (+2px air) on both sides so nothing leaves the screen */
  .box{--over:10px;--ph:min(100cqh,calc((100cqw - 2 * var(--over) - 4px) * 1.3947),680px);height:var(--ph);width:auto;
    margin-top:calc((100cqh - var(--ph)) * .22)}   /* spare height: about a fifth above, the rest below, so title and pack read as one group */
  @supports not (height:1cqh){ .box{height:52svh} }
  #spots,.hint{display:none}
  .edges{display:block;position:absolute;inset:0;pointer-events:none;--r1:43%;--r2:62%;--r3:81%}
  .edge-col{position:absolute;top:0;bottom:0;display:grid;justify-items:stretch;
    grid-template-rows:calc(var(--r1) - 22px) 44px calc(var(--r2) - var(--r1) - 44px) 44px calc(var(--r3) - var(--r2) - 44px) 44px 1fr}
  .edge-col.start{inset-inline-start:calc(-1 * var(--over))}
  .edge-col.end{inset-inline-end:calc(-1 * var(--over))}
  .edge-col>.edge:nth-child(1){grid-row:2}
  .edge-col>.edge:nth-child(2){grid-row:4}
  .edge-col>.edge:nth-child(3){grid-row:6}
  .edge{pointer-events:auto;position:relative;height:44px;min-width:84px;display:flex;align-items:center;gap:6px;padding-inline:11px 13px;border-radius:22px;
    background:rgba(251,246,242,.95);color:#3e2249;border:1px solid rgba(62,34,73,.14);
    box-shadow:0 1px 1px rgba(31,19,36,.12),0 8px 18px -10px rgba(31,19,36,.55);
    font:500 13px/1 var(--f-body);letter-spacing:0;white-space:nowrap;touch-action:manipulation;
    transition:transform .12s ease,background-color .15s ease}
  :root[lang="en"] .edge{font-size:13px;letter-spacing:.005em}
  .edge svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .edge.lead{background:#4a2b58;color:#fbf6f2;border-color:rgba(251,246,242,.16)}
  .edge.lead svg{stroke:var(--ember)}
  .edge.pressed{transform:scale(.95);background:#efe5ec;transition-duration:.06s}
  .edge.lead.pressed{background:#3a2046}
  .edge.launch{visibility:hidden}
  .edge:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:22px}
}
@media (max-width:899.98px) and (min-width:600px){
  .scene{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px));gap:14px}
  .intro h1{font-size:42px}
  .intro p{display:block}
  .box{--over:12px}
  .edge{height:46px;font-size:14px;min-width:96px;padding-inline:13px 15px;gap:8px}
  .edge svg{width:18px;height:18px}
  .edge-col{grid-template-rows:calc(var(--r1) - 23px) 46px calc(var(--r2) - var(--r1) - 46px) 46px calc(var(--r3) - var(--r2) - 46px) 46px 1fr}
}
@media (max-width:399.98px){ :root[lang="en"] .edge{font-size:12.5px;padding-inline:9px 11px;gap:5px} :root[lang="en"] .edge svg{width:16px;height:16px} }
@media (max-width:359.98px){ .edge{font-size:12.5px;padding-inline:9px 11px;gap:5px;min-width:78px} .edge svg{width:16px;height:16px} }

/* ───────── worlds: shared ───────── */
.world{--fg:var(--ink);--mute:var(--ink-2);--line:rgba(43,27,49,.14);color:var(--fg)}
.world.dark{--fg:var(--paper);--mute:color-mix(in srgb,var(--paper) 68%,transparent);--line:rgba(251,246,242,.14)}
.wrap{min-height:100%;padding-top:calc(var(--bar-h) + env(safe-area-inset-top,0px) + 18px);padding-bottom:max(28px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
@media (min-width:600px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
@media (min-width:900px){.wrap{padding-left:max(6vw,env(safe-area-inset-left,0px));padding-right:max(6vw,env(safe-area-inset-right,0px));padding-top:calc(var(--bar-h) + 36px)}}
.inner{width:100%;max-width:1240px;margin-inline:auto;flex:1;display:flex;flex-direction:column}
.kicker{display:flex;align-items:baseline;gap:12px;font-size:13px;color:var(--mute);margin:0 0 8px}
.kicker .num{font-size:18px;color:var(--fg)}
.kicker::after{content:"";flex:0 0 36px;height:1px;background:currentColor;opacity:.5;align-self:center}
.h2{font-family:var(--f-display);font-weight:500;font-size:clamp(32px,5vw,62px);line-height:1.12;margin:0;text-wrap:balance}
:root[lang="en"] .h2{font-weight:400;font-size:clamp(36px,5.4vw,68px);letter-spacing:-.01em}
.lede{font-size:clamp(15px,1.25vw,17px);color:var(--mute);max-width:52ch;margin:10px 0 0}
.next{margin-top:auto;padding-top:40px}
.next-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:18px}
.next button{display:inline-flex;flex-direction:column;gap:2px;text-align:start;color:inherit;min-height:44px}
.next small{font-size:12.5px;color:var(--mute)}
.next .go{font-family:var(--f-display);font-size:clamp(21px,2.4vw,30px);font-weight:500;display:inline-flex;align-items:center;gap:12px}
.next .go svg{width:22px;height:22px;transition:transform .3s var(--ease-out)}
[dir="rtl"] .next .go svg{transform:scaleX(-1)}
.next button:hover .go svg{transform:translateX(5px)}
[dir="rtl"] .next button:hover .go svg{transform:scaleX(-1) translateX(5px)}
.next .home-link{font-size:14px;color:var(--mute);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px;justify-content:center}
.next .home-link:hover{color:var(--fg)}
.btn-line{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:46px;padding-inline:20px;border:1px solid currentColor;border-radius:23px;font-size:14.5px;transition:background-color .2s,color .2s,opacity .2s}
.btn-line:hover:not([disabled]){background:var(--fg);color:var(--bg,var(--paper))}
.btn-line[disabled]{opacity:.28;cursor:default}
.btn-line svg{width:18px;height:18px}
.ibtn{width:48px;height:48px;padding:0;flex:none}
[dir="rtl"] .flip{transform:scaleX(-1)}
.swap-in{animation:swapIn .42s var(--ease-out) both}
@keyframes swapIn{from{opacity:0;transform:translateX(var(--sx,16px))}}
.rise>*{animation:rise .5s var(--ease-out) both}
.rise>*:nth-child(2){animation-delay:.05s}.rise>*:nth-child(3){animation-delay:.1s}.rise>*:nth-child(4){animation-delay:.15s}.rise>*:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:.001;transform:translateY(12px)}}

/* ───────── 01 HOW TO USE ───────── */
#w-how{background:var(--paper);--bg:var(--paper)}
.how-grid{display:grid;gap:18px;margin-top:6px;flex:1;align-content:start}
.stage-ill{position:relative;aspect-ratio:1;width:min(100%,500px);justify-self:center;touch-action:pan-y;user-select:none}
.stage-ill .ring{position:absolute;inset:4%;border-radius:50%;border:1px solid rgba(43,27,49,.12)}
.stage-ill .ring::after{content:"";position:absolute;inset:9%;border-radius:50%;background:radial-gradient(circle,rgba(231,173,157,.22),rgba(231,173,157,0) 70%)}
.stage-ill svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ill{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;direction:ltr}
.ill .paperfill{fill:var(--paper)}
.ill .warm{stroke:var(--ember-deep)}
.ill .warmfill{fill:rgba(231,173,157,.38);stroke:var(--ember-deep)}
.ill .soft{stroke:rgba(43,27,49,.35)}
.ill .lilacfill{fill:var(--lilac-soft)}
.ill text{stroke:none;fill:var(--ink);font-family:var(--f-body);font-size:12px}
.ill .dial-num{font-family:var(--f-latin);font-size:118px;font-weight:300;fill:var(--ink)}
.ill .arc{stroke:var(--ember-deep);stroke-width:5}
.ill .arrow{stroke:var(--ember-deep);stroke-width:1.5}
.dial-arc{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:arc 1.2s .1s var(--ease-out) forwards}
@keyframes arc{to{stroke-dashoffset:0}}
.step-text{min-width:0;display:flex;flex-direction:column;gap:16px}
.step-head{display:flex;align-items:flex-end;gap:14px}
.step-no{font-family:var(--f-latin);font-weight:300;font-size:clamp(52px,8vw,112px);line-height:.78;color:var(--violet)}
.step-title{font-family:var(--f-display);font-weight:500;font-size:clamp(25px,3.2vw,44px);line-height:1.15;margin:0}
:root[lang="en"] .step-title{font-weight:400}
.step-detail{font-size:clamp(16px,1.3vw,19px);line-height:1.75;max-width:36ch;margin:10px 0 0}
.note-skin{display:flex;gap:8px;align-items:flex-start;margin:10px 0 0;font-size:14px;color:var(--alert);max-width:40ch}
.note-skin svg{flex:none;width:18px;height:18px;margin-top:3px}
.onbox{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--ink-2)}
.onbox i{width:40px;height:40px;flex:none;border-radius:6px;background-repeat:no-repeat;box-shadow:0 0 0 1px rgba(43,27,49,.1)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper .ibtn{--fg:var(--ink)}
.rail{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;min-width:0}
.rail button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px 0 6px;text-align:start;font-size:12.5px;color:var(--ink-2);min-height:44px}
.rail button::before{content:"";width:100%;height:2px;background:rgba(43,27,49,.14);transition:background-color .25s}
.rail button[aria-current="step"]{color:var(--ink)}
.rail button[aria-current="step"]::before,.rail button.done::before{background:var(--violet)}
.rail .num{font-size:15px;line-height:1}
.rail .lbl{line-height:1.3}
@media (min-width:900px){
  .how-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:center;gap:6vw;margin-top:10px}
  .how-grid .stage-ill{order:2}
  .stage-ill{width:min(100%,calc(100svh - 230px),500px)}
}
@media (max-width:899.98px){
  .stage-ill{width:min(74vw,34svh,420px)}
  .rail .lbl{display:none}
  .rail button{padding-top:18px}
  .step-text{gap:12px}
}

/* ───────── 02 PRODUCT ───────── */
#w-product{background:var(--plum);--bg:var(--plum)}
#w-product .wrap{background:radial-gradient(80% 70% at 30% 45%,#3d2648,var(--plum) 70%)}
.prod{display:grid;gap:18px;flex:1;align-items:center;margin-top:4px}
.viewer{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.plate{position:relative;width:min(100%,calc(54svh * .74),520px);aspect-ratio:.74;overflow:hidden;cursor:zoom-in;touch-action:pan-y;user-select:none;-webkit-user-select:none;border-radius:2px}
.plate:focus-visible{outline-offset:2px}
.plate.zoomed{cursor:grab;touch-action:none;background:rgba(10,5,12,.25)}
.plate.dragging{cursor:grabbing}
.plate img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:50% 50%;will-change:transform;-webkit-user-drag:none;pointer-events:none}
.plate .shadowed{filter:drop-shadow(0 26px 34px rgba(10,5,12,.45))}
.unzoom{position:absolute;top:10px;inset-inline-end:10px;z-index:2;display:inline-flex;align-items:center;gap:6px;height:40px;padding-inline:14px;border-radius:20px;background:rgba(31,19,36,.82);color:var(--paper);font-size:13.5px;border:1px solid rgba(251,246,242,.25)}
.unzoom svg{width:14px;height:14px}
.zoomhint{font-size:12px;color:var(--mute);margin:0;text-align:center}
.angles{display:flex;align-items:center;gap:6px}
.angles .ibtn{--fg:var(--paper);--bg:var(--plum);width:44px;height:44px;border-color:rgba(251,246,242,.35)}
.views{display:flex;gap:4px}
.views button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mute);width:78px;padding:4px 0}
.views i{display:block;width:40px;height:52px;background-size:contain;background-position:center;background-repeat:no-repeat;opacity:.5;transition:opacity .25s,transform .25s var(--ease-out)}
.views button[aria-pressed="true"]{color:var(--paper)}
.views button[aria-pressed="true"] i{opacity:1;transform:translateY(-2px)}
.views button[aria-pressed="true"] span{box-shadow:inset 0 -1px var(--gold)}
.prod-copy{min-width:0}
.prod .logo-big{display:block;width:min(64%,280px);aspect-ratio:935/304;background:var(--paper);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.prod .sub{font-family:var(--f-display);font-size:clamp(18px,1.8vw,24px);margin:14px 0 0;color:var(--lilac)}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:24px 0 0;border-top:1px solid var(--line)}
.specs div{padding:14px 0 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.specs div:nth-child(odd){padding-inline-end:16px;border-inline-end:1px solid var(--line)}
.specs div:nth-child(even){padding-inline-start:18px}
.specs b{direction:ltr;font-family:var(--f-latin);font-weight:300;font-size:clamp(36px,3.6vw,52px);line-height:1;color:var(--paper)}
[dir="rtl"] .specs b{text-align:right}
.specs b em{font-style:italic;font-size:.55em;color:var(--ember);margin-inline-start:2px}
.specs span{font-size:13.5px;color:var(--mute)}
@media (min-width:900px){
  .prod{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:5vw}
  .plate{width:min(100%,calc((100svh - 250px)*.74),540px)}
}

/* ───────── 03 BENEFITS ───────── */
#w-benefits{background:var(--lilac);--bg:var(--lilac)}
.ben{display:grid;gap:14px;flex:1;align-items:center}
.lead8{display:grid;align-items:end}
.eight{direction:ltr;display:flex;align-items:flex-end;gap:8px;line-height:.78}
[dir="rtl"] .eight{justify-content:flex-end}
.eight .big{font-family:var(--f-latin);font-weight:300;font-size:clamp(220px,46svh,480px);color:var(--violet);letter-spacing:-.04em;margin-block:-.06em -.02em}
.eight .h{font-family:var(--f-latin);font-style:italic;font-size:clamp(40px,7svh,78px);color:var(--ember-deep);padding-bottom:.25em}
.eight-cap{display:flex;flex-direction:column;gap:4px;margin:10px 0 0;max-width:30ch}
.eight-cap strong{font-family:var(--f-display);font-weight:500;font-size:clamp(24px,2.8vw,38px);line-height:1.2}
.eight-cap span{color:var(--ink-2)}
.ben-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ben-list li{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:14px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line)}
.ben-list svg{width:24px;height:24px;align-self:center;grid-row:span 2}
.ben-list strong{font-family:var(--f-display);font-weight:500;font-size:clamp(19px,1.9vw,27px);line-height:1.3}
:root[lang="en"] .ben-list strong{font-size:clamp(21px,2vw,29px)}
.ben-list span{color:var(--ink-2);font-size:14.5px;line-height:1.6}
.ic{fill:none;stroke:var(--violet);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:900px){ .ben{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6vw} }
@media (max-width:899.98px){
  .lead8{grid-template-columns:auto minmax(0,1fr);gap:16px;padding-bottom:6px}
  .eight .big{font-size:clamp(120px,21svh,190px)}
  .eight .h{font-size:34px}
  .eight-cap{margin:0 0 6px}
  .eight-cap strong{font-size:24px}
  .eight-cap span{font-size:14.5px;line-height:1.55}
  .ben-list li{padding:11px 0}
  .ben-list strong{font-size:19px}
  .ben-list span{font-size:14px}
}

/* ───────── 04 INGREDIENTS ───────── */
#w-ingredients{background:var(--paper);--bg:var(--paper)}
.ing{display:grid;gap:28px;margin-top:22px}
.ing-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.ing-list li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.ing-list .num{font-size:16px;color:var(--ink-2)}
.ing-list .n{font-size:clamp(17px,1.4vw,19px)}
.ing-list .alt{font-size:12.5px;color:var(--ink-2);text-align:end}
.ing-list .herb .n{font-family:var(--f-display);font-weight:600;color:var(--violet)}
.ing-list .herb .num{color:var(--ember-deep)}
.herbal{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:center}
.herbal svg{width:96px;height:auto}
.herbal h3{font-family:var(--f-latin);font-weight:400;font-style:italic;font-size:clamp(32px,3.4vw,46px);line-height:1;margin:0;color:var(--violet)}
.herbal p{margin:8px 0 0;color:var(--ink-2);font-size:14.5px}
.source{margin:0}
.source .plate-strip{position:relative;width:100%;aspect-ratio:8.69;overflow:hidden;border-radius:3px;background:#6e5687}
.source .plate-strip img{position:absolute;max-width:none;width:137%;left:-15.07%;top:-673.2%}
.source .plate-strip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:#6e5687}
.source figcaption{font-size:12.5px;color:var(--ink-2);margin-top:10px;display:flex;gap:8px;align-items:center}
.source figcaption::before{content:"";width:18px;height:1px;background:currentColor}
@media (min-width:900px){
  .ing{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:6vw;align-items:start}
  .ing-side{position:sticky;top:110px;display:flex;flex-direction:column;gap:34px}
}
@media (max-width:599.98px){
  .ing-list li{grid-template-columns:34px minmax(0,1fr);row-gap:0}
  .ing-list .alt{grid-column:2;text-align:start}
  .ing-side{display:flex;flex-direction:column;gap:26px}
}

/* ───────── 05 CARE ───────── */
#w-care{background:var(--white);--bg:var(--white)}
.care-top{display:grid;gap:18px;margin-top:16px;align-items:center}
.statement{font-family:var(--f-display);font-weight:500;font-size:clamp(23px,3vw,40px);line-height:1.35;margin:0;max-width:22ch;text-wrap:balance}
:root[lang="en"] .statement{font-weight:400}
.layers-fig{margin:0;max-width:340px;width:100%}
.layers-fig svg{width:100%;height:auto;direction:ltr}
.layers-fig text{font-family:var(--f-body);font-size:12.5px;fill:var(--ink)}
.care-list{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:0 5vw;border-top:2px solid var(--ink)}
.care-list li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;padding:16px 0;border-bottom:1px solid var(--line);font-size:clamp(16.5px,1.35vw,18.5px);line-height:1.75}
.care-list .num{font-size:20px;color:var(--ink-2);line-height:1.5}
.care-list li.stop .num,.care-list li.stop span{color:var(--alert)}
@media (min-width:900px){
  .care-top{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);margin-top:24px}
  .care-list{grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(3,auto)}
}

/* ───────── 06 FAQ ───────── */
#w-faq{background:var(--night);--bg:var(--night)}
.faq{display:grid;gap:20px;margin-top:18px;align-items:start}
.qs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.qs li{border-bottom:1px solid var(--line)}
.qs h3{margin:0;font:inherit}
.qs button{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) 18px;gap:10px;align-items:baseline;padding:13px 0;text-align:start;font-size:clamp(15.5px,1.25vw,17px);line-height:1.55;color:var(--mute);transition:color .2s;min-height:48px}
.qs .num{font-size:15px;color:var(--gold);opacity:.85}
.qs button:hover,.qs button[aria-expanded="true"]{color:var(--paper)}
.qs button svg{width:16px;height:16px;align-self:center;transition:transform .3s var(--ease-out);opacity:.6}
.qs button[aria-expanded="true"] svg{transform:rotate(45deg);opacity:1;color:var(--ember)}
.ans-inline{padding:0 40px 18px 0;animation:swapIn .35s var(--ease-out) both;--sx:0px}
[dir="ltr"] .ans-inline{padding:0 0 18px 40px}
.ans-inline p,.panel p.a{font-size:clamp(16px,1.35vw,19px);line-height:1.8;margin:0;max-width:44ch;color:color-mix(in srgb,var(--paper) 90%,transparent)}
.pending{display:inline-flex;margin-top:12px;font-size:12.5px;color:var(--ember);border:1px solid rgba(231,173,157,.4);border-radius:14px;padding:2px 12px}
.panel{position:sticky;top:100px;padding-top:6px}
.panel .qno{font-family:var(--f-latin);font-weight:300;font-size:104px;line-height:1;color:var(--gold);opacity:.6;display:inline-block;margin-bottom:6px}
.panel .q{font-family:var(--f-display);font-weight:500;font-size:clamp(24px,2.6vw,36px);line-height:1.25;margin:0 0 12px;text-wrap:balance}
:root[lang="en"] .panel .q{font-weight:400}
.panel.fresh>*{animation:swapIn .35s var(--ease-out) both}
@media (min-width:900px){ .faq{grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:6vw} }

/* ───────── CONTACT ───────── */
#w-contact{background:var(--paper);--bg:var(--paper)}
.contact{display:grid;gap:30px;margin-top:16px;align-items:start}
.soon{border-top:1px solid var(--ink);padding-top:20px;display:grid;gap:14px}
.soon .state{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-size:clamp(22px,2.4vw,30px);font-weight:500;line-height:1.3;margin:0}
:root[lang="en"] .soon .state{font-weight:400}
.soon .state::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--ember-deep);box-shadow:0 0 0 5px rgba(184,97,76,.14)}
.soon p{margin:0;color:var(--ink-2);max-width:46ch}
.channels{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.channels li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.channels b{font-family:var(--f-latin);font-weight:500;font-size:22px}
.channels span{font-size:13.5px;color:var(--ink-2)}
.to-faq{justify-self:start;--fg:var(--ink);--bg:var(--paper)}
form{display:grid;gap:16px;min-width:0}
.pair{display:grid;gap:16px}
label{display:grid;gap:6px;font-size:13px;color:var(--ink-2)}
input,select,textarea{width:100%;min-height:48px;padding:10px 0;border:0;border-bottom:1px solid rgba(43,27,49,.35);background:transparent;color:var(--ink);font-size:16px;border-radius:0}
textarea{min-height:110px;resize:vertical}
@media (min-width:900px){ .contact{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7vw;margin-top:24px} .pair{grid-template-columns:1fr 1fr} }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}
}
</style>
</head>
<body>


<header class="bar" id="bar">
  <button class="brand" id="brand" type="button" aria-label="Warmhug"><i></i></button>
  <button class="back" id="back" type="button" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    <span data-t="back"></span>
  </button>
  <span class="crumb" id="crumb" aria-hidden="true"></span>
  <nav aria-label="Site">
    <button type="button" data-go="contact" id="nav-contact" data-t="navContact"></button>
    <button type="button" id="lang"></button>
  </nav>
</header>

<main>
  <section class="layer home" id="home" aria-labelledby="home-h1">
    <div class="atmo" aria-hidden="true"><i></i></div>
    <div class="scene" id="scene">
      <div class="intro" id="intro">
        <h1 id="home-h1" data-t="hero"></h1>
        <p data-t="tagline"></p>
        <ul class="facts" id="facts"></ul>
      </div>
      <div class="stage" id="stage">
        <div class="box" id="box">
          <div class="boxin" id="boxin">
            <img class="shot" data-img="front" id="shot" alt="">
            <div id="spots"></div>
          </div>
          <nav class="edges" id="edges" aria-label="Sections"></nav>
        </div>
      </div>
      <p class="hint" id="hint"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="8" r="2.2" fill="currentColor"/><circle cx="8" cy="8" r="6"/></svg><span data-t="hint"></span></p>
    </div>
  </section>

  <section class="layer world off" id="w-how" data-world="how" data-tone="light" aria-labelledby="h-how"></section>
  <section class="layer world dark off" id="w-product" data-world="product" data-tone="dark" aria-labelledby="h-product"></section>
  <section class="layer world off" id="w-benefits" data-world="benefits" data-tone="lilac" aria-labelledby="h-benefits"></section>
  <section class="layer world off" id="w-ingredients" data-world="ingredients" data-tone="light" aria-labelledby="h-ingredients"></section>
  <section class="layer world off" id="w-care" data-world="care" data-tone="white" aria-labelledby="h-care"></section>
  <section class="layer world dark off" id="w-faq" data-world="faq" data-tone="night" aria-labelledby="h-faq"></section>
  <section class="layer world off" id="w-contact" data-world="contact" data-tone="light" aria-labelledby="h-contact"></section>
</main>
<p class="sr" id="live" aria-live="polite"></p>

<script>

/* ================= NAVIGATION =================
   One controller (NAV) owns the visible scene, the transition in flight and the browser-history entry.
     phase: "home" | "entering" | "world" | "leaving"     kind: "enter" | "leave" | "swap" | null
   Every transition gets a new operation number (NAV.op). Animation-end callbacks and timers carry the number
   they were created with and do nothing if a newer operation has started; starting one also clears old timers.
   There are no retries and no delayed re-routing: nothing pending can reopen a section later. */
const DUR=720, EASE="cubic-bezier(.32,.72,.16,1)";
const NAV={phase:"home",kind:null,id:null,op:0,anims:[],timers:[]};
const BASE=location.pathname+location.search;
const BUILD="v12.7";
document.documentElement.dataset.build=BUILD;

/* release build: the diagnostics log is compiled out */
function log(){}
function desc(){ return ""; }
const mirror=e=>{const m=e.match(/[\d.]+/g).map(Number);return `cubic-bezier(${1-m[2]},${1-m[3]},${1-m[0]},${1-m[1]})`;};
function anim(list,el,kf,{d=0,D=DUR,e=EASE}={},rev=false){
  if(!el) return null;
  const a=el.animate(kf,{duration:D,delay:rev?Math.max(0,DUR-d-D):d,easing:rev?mirror(e):e,fill:"both",direction:rev?"reverse":"normal"});
  a.id="journey"; list.push(a); return a;
}
/* where the UI is, or is heading to */
function targetView(){ return (NAV.phase==="home"||NAV.phase==="leaving")?"home":NAV.id; }
function busy(){ return NAV.phase==="entering"||NAV.phase==="leaving"; }
function setTone(id){document.body.dataset.tone=id==="home"?"":$("#w-"+id).dataset.tone;}
function setCrumb(id){
  const c=$("#crumb"),b=$("#back");
  if(id==="home"){c.innerHTML="";b.hidden=true;return;}
  b.hidden=false; c.innerHTML=(NUM[id]?`<span class="num">${NUM[id]}</span>`:"")+esc(U().names[id]);
}
function newOp(){ NAV.op++; NAV.timers.forEach(clearTimeout); NAV.timers=[]; return NAV.op; }
function later(op,ms,fn){ NAV.timers.push(setTimeout(()=>{ if(NAV.op===op) fn(); else log("timer-stale",{of:op}); },ms)); }
function done(op,anims,fn){ Promise.all(anims.map(a=>a.finished)).then(()=>{ if(NAV.op===op){ log("anim-done",{of:op}); fn(); } else log("anim-cb-stale",{of:op}); },()=>{}); }
/* while a transition runs, both scenes are locked; only the top bar (back / language) stays live */
function lock(){ document.body.classList.add("moving"); $("#home").inert=true; $$(".world").forEach(w=>w.inert=true); }
/* the single place that decides the final, static state. Idempotent. */
function settle(target){
  newOp();
  NAV.anims.forEach(a=>{ try{a.cancel();}catch(_){} }); NAV.anims=[];
  document.getAnimations().forEach(a=>{ if(a.id==="journey") a.cancel(); });
  $$(".ghost,.ghost-img").forEach(g=>g.remove());
  const home=$("#home"), isHome=target==="home";
  home.classList.toggle("off",!isHome); home.inert=!isHome;
  $$(".world").forEach(w=>{const on=w.dataset.world===target; w.classList.toggle("off",!on); w.inert=!on; w.style.zIndex="";});
  $$(".pressed,.launch").forEach(s=>s.classList.remove("pressed","launch"));
  $("#boxin").style.transformOrigin="";
  NAV.phase=isHome?"home":"world"; NAV.kind=null; NAV.id=isHome?null:target;
  view=target; setTone(target); setCrumb(target);
  document.body.classList.remove("moving");
  NAV.settledAt=performance.now();
  log("settle",{to:target});
}
/* land whatever is in flight immediately, at the place it was heading to */
function finishActive(){ if(busy()) settle(targetView()); }

/* ---------- history: one entry per visit to a section, pushed from a home entry ----------
   home entry:    {wh:1, id:null}
   section entry: {wh:1, id, fromHome:true}   (pushed by us on top of a home entry)
                  {wh:1, id, fromHome:false}  (stamped: a hash we did not create, e.g. typed by hand) */
function histHome(){ return {wh:1,id:null}; }
function stamp(state,url,push){ try{ history[push?"pushState":"replaceState"](state,"",url); }catch(_){} }
/* in-site "back" never calls history.back(): that call is asynchronous and makes the browser fire
   popstate/hashchange later, at a time that differs between browsers and in-app viewers. Instead the current
   entry is rewritten to home, synchronously. The next section visit reuses this entry, so history stays short. */
function historyToHome(){ log("history",{action:"replace->home"}); stamp({wh:1,id:null,reuse:true},BASE,false); }
function onHistory(ev){
  let st=history.state; const h=location.hash.slice(1);
  if(!(st&&st.wh)){ st={wh:1,id:W[h]?h:null,fromHome:false}; stamp(st,st.id?"#"+st.id:BASE,false); }
  const target=st.id||"home";
  log(ev?ev.type:"history-event",{dest:target});
  /* browser back/forward: the browser already shows its own transition, so the scene changes instantly */
  request(target,{source:"history",via:ev?ev.type:"history"});
}
/* popstate and hashchange can both fire for one traversal; the second finds the UI already heading there and does nothing */
addEventListener("popstate",onHistory);
addEventListener("hashchange",onHistory);

/* the point every journey is centred on */
function pointFor(id,trigger){
  let el=null;
  if(id==="contact") el=trigger&&trigger.id==="nav-contact"?trigger:$("#nav-contact");
  else el=isWide()?$(`.spot[data-go="${id}"] .dot`):$(`.edge[data-go="${id}"]`);
  let r=el?.getBoundingClientRect();
  if(!r||!r.width){ r=trigger?.getBoundingClientRect(); }
  const p=r&&r.width?{x:r.left+r.width/2,y:r.top+r.height/2}:{x:innerWidth/2,y:innerHeight/2};
  return {x:clamp(p.x,8,innerWidth-8),y:clamp(p.y,8,innerHeight-8)};
}
function visibleRect(el){ if(!el) return null; const r=el.getBoundingClientRect(); if(!r.width||r.bottom<0||r.top>innerHeight) return null; return r; }

/* build the whole journey for home <-> world `id`. rev=true plays it backwards (leaving). */
function journey(id,p,rev){
  /* every piece of the journey must receive `rev`: without it a return plays the entry forwards (bug fixed in v12.7) */
  const J=(el,kf,o)=>anim(L,el,kf,o,rev);
  const L=[], home=$("#home"), w=$("#w-"+id), boxin=$("#boxin");
  /* measure the arrival element before anything moves */
  let anchor=$("[data-anchor]",w), ar=visibleRect(anchor);
  if(!ar){ anchor=$("h2.h2",w); ar=visibleRect(anchor); }
  const product=id==="product";
  const tab=!isWide()&&id!=="contact"?$(`.edge[data-go="${id}"]`):null, tr=tab?tab.getBoundingClientRect():null;
  J($("#edges"),[{opacity:1},{opacity:0}],{D:220,e:"cubic-bezier(.4,0,.6,1)"});
  /* 1. the scene: far layers move little, the pack moves past the camera, labels clear away from the point */
  const br=boxin.getBoundingClientRect();
  boxin.style.transformOrigin=`${p.x-br.left}px ${p.y-br.top}px`;
  J($(".atmo",home),[{transform:"scale(1)",opacity:1},{opacity:1,offset:.35},{transform:"scale(1.12)",opacity:0}],{D:DUR});
  if(product){
    J($("#shot"),[{opacity:1},{opacity:0}],{D:60,e:"cubic-bezier(.4,0,.6,1)"});
    J($("#spots"),[{opacity:1},{opacity:0}],{D:200,e:"cubic-bezier(.4,0,.6,1)"});
  }else{
    J(boxin,[{transform:"scale(1)",opacity:1},{opacity:1,offset:.42},{transform:"scale(2.15)",opacity:0}],{D:600,e:"cubic-bezier(.45,.05,.2,1)"});
    J($("#spots"),[{opacity:1},{opacity:0}],{D:200,e:"cubic-bezier(.4,0,.6,1)"});
  }
  ["#intro","#hint"].forEach(s=>{const el=$(s,home); const r=visibleRect(el); if(!r) return;
    const cx=r.left+r.width/2-p.x, cy=r.top+r.height/2-p.y, m=Math.hypot(cx,cy)||1;
    J(el,[{transform:"none",opacity:1},{transform:`translate(${cx/m*28}px,${cy/m*28}px)`,opacity:0}],{D:240,e:"cubic-bezier(.4,0,.2,1)"});});
  /* 2. the world grows out of the same point */
  J(w,[{opacity:0},{opacity:1}],{d:200,D:360,e:"cubic-bezier(.3,0,.3,1)"});
  const inner=$(".inner",w), ir=inner.getBoundingClientRect();
  const icx=ir.left+ir.width/2, icy=Math.min(ir.top+ir.height/2, innerHeight/2);
  J(inner,[{transform:`translate(${(p.x-icx)*.22}px,${(p.y-icy)*.22}px) scale(.9)`},{transform:"none"}],{d:170,D:550});
  /* 3. one element travels between the two worlds */

  if(ar){
    if(product){
      /* the pack itself flies from the scene into the editorial frame (object-fit: contain rect) */
      const s=$("#box").getBoundingClientRect(), A=646/894;
      let cw=ar.width, ch=cw/A; if(ch>ar.height){ ch=ar.height; cw=ch*A; }
      const cl=ar.left+(ar.width-cw)/2, ct=ar.top+(ar.height-ch)/2;
      const g=new Image(); g.src=IMG.cfront; g.className="ghost-img"; g.alt="";
      Object.assign(g.style,{left:s.left+"px",top:s.top+"px",width:s.width+"px",height:s.width/A+"px"});
      document.body.appendChild(g);
      J(g,[{transform:"translate(0,0) scale(1)"},{transform:`translate(${cl-s.left}px,${ct-s.top}px) scale(${cw/s.width})`}],{D:640,e:"cubic-bezier(.5,0,.15,1)"});
      J(anchor,[{opacity:0},{opacity:0,offset:.99},{opacity:1}],{D:DUR});
    }else{
      const circle=!["care","contact","faq"].includes(id)||anchor.classList.contains("qno"), side=Math.max(ar.width,ar.height)*(id==="faq"?1.35:id==="how"?1:.95);
      const tw=circle?side:ar.width+10, th=circle?side:ar.height+10;
      const tx=ar.left+ar.width/2-tw/2, ty=ar.top+ar.height/2-th/2;
      const dark=$("#w-"+id).classList.contains("dark");
      const g=document.createElement("div"); g.className="ghost"; document.body.appendChild(g);
      /* on phones the pressed capsule itself becomes the travelling ring */
      /* the outline lifts off the pressed capsule while the capsule itself fades with the other tabs */
      const from=tr?{left:tr.left+"px",top:tr.top+"px",width:tr.width+"px",height:tr.height+"px",borderRadius:"22px",backgroundColor:"rgba(251,246,242,0)",borderColor:"rgba(217,195,154,1)",opacity:1}
                    :{left:p.x-11+"px",top:p.y-11+"px",width:"22px",height:"22px",borderRadius:"50%",backgroundColor:"rgba(251,246,242,0)",borderColor:"rgba(217,195,154,1)",opacity:1};
      J(g,[from,
                {opacity:1,offset:.78},
                {left:tx+"px",top:ty+"px",width:tw+"px",height:th+"px",borderRadius:circle?"50%":"8px",backgroundColor:"rgba(251,246,242,0)",borderColor:dark?"rgba(217,195,154,.55)":"rgba(109,71,130,.45)",opacity:0}],{D:660,e:"cubic-bezier(.5,0,.15,1)"});
      J(anchor,[{opacity:0},{opacity:1}],{d:440,D:260});
    }
  }
  return L;
}

/* every navigation request goes through here, whether it comes from a click, a key, the browser or the boot */
function request(target,{trigger=null,source="ui",via="ui"}={}){
  const R=decision=>log("request",{dest:target,source:via,from:trigger?desc(trigger):"-",decision});
  if(target!=="home"&&!W[target]){ R("ignored: unknown destination"); return; }
  const instant=source==="history";
  if(target===targetView()){ R("ignored: already there or already heading there"); return; }
  if(target==="home"){
    if(NAV.phase==="entering"&&NAV.kind==="enter"&&!instant){ R("accepted: reverse the entry in flight"); return reverseEnter(source); }
    finishActive();
    if(NAV.phase==="home"){ R("ignored: home after landing"); return; }
    if(instant){ R("accepted: home (instant, browser history)"); const id=NAV.id; settle("home"); focusHome(id); return; }
    R("accepted: leave"); return leave(source);
  }
  finishActive();
  if(NAV.phase==="home"){ R(instant?"accepted: enter (instant, browser history)":"accepted: enter"); return enter(target,trigger,source,instant); }
  R("accepted: swap"); return swap(target,trigger,source,instant);
}

function enter(id,trigger,source,instant=false){
  const home=$("#home"), w=$("#w-"+id);
  const p=pointFor(id,trigger);
  const op=newOp(); NAV.phase="entering"; NAV.kind="enter"; NAV.id=id; log("enter-start",{to:id});
  if(source==="ui"){ const st=history.state; stamp({wh:1,id,fromHome:true},"#"+id,!(st&&st.wh&&st.reuse)); }   // one entry, reused after an in-site back
  renderWorld(id); w.scrollTop=0; w.classList.remove("off");
  lock();
  $(`.spot[data-go="${id}"]`)?.classList.add("pressed","launch");
  if(instant||reduce()||!w.animate){ settle(id); focusWorld(id); return; }
  setCrumb(id);                                                      // "back" is available from the first frame of the entry
  NAV.anims=journey(id,p,false);
  later(op,DUR*.35,()=>{ setTone(id); });
  done(op,NAV.anims,()=>{ settle(id); focusWorld(id); });
}

function reverseEnter(source){
  const id=NAV.id, op=newOp(); NAV.phase="leaving"; NAV.kind="leave"; log("reverse-start",{from:id});
  if(source==="ui") historyToHome();
  NAV.anims.forEach(a=>a.reverse());
  setTone("home"); setCrumb("home");
  done(op,NAV.anims,()=>{ settle("home"); focusHome(id); });
}

function leave(source){
  const id=NAV.id, home=$("#home"), w=$("#w-"+id);
  const op=newOp(); NAV.phase="leaving"; NAV.kind="leave"; log("leave-start",{from:id});
  if(source==="ui") historyToHome();
  home.classList.remove("off"); lock();
  if(reduce()||!w.animate){ settle("home"); focusHome(id); return; }
  NAV.anims=journey(id,pointFor(id),true);
  later(op,DUR*.4,()=>{ setTone("home"); setCrumb("home"); });
  done(op,NAV.anims,()=>{ settle("home"); focusHome(id); });
}

/* world → world: the current world recedes past the camera, the next one settles in from just behind it */
function swap(id,trigger,source,instant=false){
  const from=NAV.id, a=$("#w-"+from), b=$("#w-"+id);
  const op=newOp(); NAV.phase="entering"; NAV.kind="swap"; NAV.id=id; log("swap-start",{from,to:id});
  if(source==="ui"){ const st=history.state; stamp({wh:1,id,fromHome:!!(st&&st.wh&&st.fromHome)},"#"+id,false); }
  renderWorld(id); b.scrollTop=0; b.classList.remove("off"); b.style.zIndex=21;
  lock();
  if(instant||reduce()||!b.animate){ settle(id); focusWorld(id); return; }
  const L=[];
  anim(L,a,[{transform:"scale(1)",opacity:1},{transform:"scale(1.05)",opacity:0}],{D:340,e:"cubic-bezier(.4,0,.2,1)"});
  anim(L,b,[{opacity:0},{opacity:1}],{d:120,D:360,e:"cubic-bezier(.3,0,.3,1)"});
  anim(L,$(".inner",b),[{transform:"translateY(18px) scale(.97)"},{transform:"none"}],{d:120,D:480});
  NAV.anims=L;
  later(op,180,()=>{ setTone(id); setCrumb(id); });
  done(op,L,()=>{ settle(id); focusWorld(id); });
}
function focusWorld(id){ $("#h-"+id)?.focus({preventScroll:true}); $("#live").textContent=U().names[id]; }
function focusHome(id){
  const el=id==="contact"?$("#nav-contact"):(isWide()?$(`.spot[data-go="${id}"]`):$(`.edge[data-go="${id}"]`));
  el?.focus({preventScroll:true}); $("#live").textContent=U().home;
}
function goHome(via="ui"){ request("home",{source:"ui",via}); }

/* ================= INTERACTIONS ================= */
/* ---------- activation ----------
   Navigation controls are activated by the gesture itself, not by the browser's synthesized click.
   v12.3 proven cause: a touch that starts while the scene is changing and ends after it has settled was
   turned by the browser into a click on whatever was then under the finger (a section tab), reopening it.
   Browsers also differ in which element they send that click to. So for touch/pen a control fires on pointerup
   only if the same press began on it, on a stable screen, nothing changed since, and the finger is still on it;
   the click that follows is then swallowed. Mouse uses click with the same press check. Keyboard and assistive
   technology (click with detail 0, no pointer press) work as usual. */
const NAVSEL="[data-go],[data-next],[data-home],#back,#brand";
let press=null, swallowUntil=0;
function pressOK(el){
  if(!press) return [false,"no press"];
  if(!press.stable) return [false,"press began during a transition"];
  if(press.el!==el) return [false,"press began on another element"];
  if(press.op!==NAV.op&&!el.closest(".bar")) return [false,"screen changed since the press began"];
  return [true,"press began on this control, screen stable"];
}
function activate(el,via){
  if(el.dataset.go||el.dataset.next) request(el.dataset.go||el.dataset.next,{trigger:el,via});
  else goHome(via+" "+desc(el));
}
window.addEventListener("pointerdown",e=>{
  swallowUntil=0;
  const el=e.target.closest?e.target.closest(NAVSEL):null;
  const bar=!!(el&&el.closest(".bar"));
  press={el,op:NAV.op,stable:bar||!busy(),x:e.clientX,y:e.clientY,id:e.pointerId,type:e.pointerType};
  log("pointerdown",{target:desc(e.target),type:e.pointerType,stable:press.stable,at:Math.round(e.clientX)+","+Math.round(e.clientY),
    sinceSettle:NAV.settledAt?Math.round(performance.now()-NAV.settledAt)+"ms":"-"});
},true);
window.addEventListener("pointerup",e=>{
  log("pointerup",{target:desc(e.target),type:e.pointerType});
  if(!press||press.id!==e.pointerId||e.pointerType==="mouse") return;
  const p=press; press=null;
  /* every click the browser derives from this touch belongs to this gesture and is ignored for navigation,
     whichever element it lands on; the window only covers this gesture's own click */
  swallowUntil=e.timeStamp+800;
  if(!p.el){ log("tap-ignored",{why:p.stable?"not on a control":"touch began during a transition"}); return; }
  const under=document.elementFromPoint(e.clientX,e.clientY);
  const moved=Math.hypot(e.clientX-p.x,e.clientY-p.y)>12;
  if(moved||!under||!p.el.contains(under)){ log("tap-rejected",{target:desc(p.el),why:moved?"finger moved":"finger left the control"}); return; }
  press=p; const [ok,why]=pressOK(p.el); press=null;
  if(!ok){ log("tap-rejected",{target:desc(p.el),why}); return; }
  activate(p.el,"tap");
},true);
window.addEventListener("pointercancel",e=>{ press=null; log("pointercancel",{target:desc(e.target)}); },true);
/* a held key auto-repeats; after a return, focus is back on the section's tab, so a repeat would reopen it */
window.addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" "&&e.key!=="Escape") return;
  log("keydown",{key:e.key===" "?"Space":e.key,target:desc(e.target),repeat:e.repeat});
  if(e.repeat&&(e.key==="Escape"||e.target.closest?.("[data-go],[data-next],[data-home],#back,#brand"))){ e.preventDefault(); e.stopImmediatePropagation(); log("key-repeat-ignored",{key:e.key}); }
},true);
window.addEventListener("focusin",e=>{ if(e.target.closest?.("[data-go],[data-next],#back,h2")) log("focus",{target:desc(e.target)}); },true);

/* instant feedback: the pressed point reacts on pointerdown, before the click is even complete */
document.addEventListener("pointerdown",e=>{
  if(busy()) return;
  const g=e.target.closest("#home [data-go]"); if(!g) return;
  $(`.spot[data-go="${g.dataset.go}"]`)?.classList.add("pressed"); g.classList.add("pressed");
},{passive:true});
/* a press that does not become a click (finger moved off, scroll) must not leave the tab looking pressed */
const unpress=()=>{ if(NAV.phase==="home") $$("#home .pressed").forEach(s=>s.classList.remove("pressed")); };
document.addEventListener("pointercancel",unpress);
document.addEventListener("pointerup",()=>{ if(NAV.phase==="home") requestAnimationFrame(unpress); });
document.addEventListener("click",e=>{
  const t=e.target;
  log("click",{target:desc(t),detail:e.detail,at:Math.round(e.clientX)+","+Math.round(e.clientY)});
  const nav=t.closest(NAVSEL);
  if(nav){
    if(e.detail!==0&&e.timeStamp<swallowUntil){ swallowUntil=0; e.preventDefault(); log("click-swallowed",{target:desc(nav),why:"click derived from a touch already handled on pointerup"}); return; }
    if(e.detail===0){ activate(nav,"key/assistive"); return; }      // keyboard, screen readers, element.click()
    const [ok,why]=press?pressOK(nav):[true,"no pointer press (assistive)"]; press=null;
    if(!ok){ e.preventDefault(); log("click-rejected",{target:desc(nav),why}); return; }
    activate(nav,"click"); return;
  }
  press=null;
  const st=t.closest("[data-step]"); if(st&&!st.disabled){ setStep(+st.dataset.step,st); return; }
  const ph=t.closest("[data-photo]"); if(ph){ setPhoto(ph.dataset.photo,ph); return; }
  const ps=t.closest("[data-photo-step]"); if(ps){ const i=(PH.indexOf(photo)+ +ps.dataset.photoStep+3)%3; setPhoto(PH[i],ps); return; }
  if(t.closest("#unzoom")){ resetZoom(true); $("#plate")?.focus({preventScroll:true}); return; }
  const qb=t.closest("[data-q]"); if(qb){ setQ(+qb.dataset.q); return; }
});

/* how: one step at a time */
function setStep(n,from){
  n=clamp(n,0,3); if(n===step) return; const dir=n>step?1:-1; step=n;
  renderWorld("how");
  $$("#w-how .swap-in").forEach(el=>el.style.setProperty("--sx",`${(lang==="ar"?-1:1)*dir*18}px`));
  let f=null;
  if(from&&from.closest(".rail")) f=$(`#w-how .rail [data-step="${n}"]`);
  else if(from){ f=$(`#w-how .stepper > [data-step="${n+dir}"]`); if(!f||f.disabled) f=$(`#w-how .stepper > [data-step="${n-dir}"]`); }
  (f||$(`#w-how .rail [data-step="${n}"]`))?.focus({preventScroll:true});
}

/* product: angle switch + zoom (tap/click, pinch, drag, wheel+ctrl, keyboard), always clamped inside the frame */
const Z={s:1,x:0,y:0}, ZMAX=3, ZTAP=2.4;
function setPhoto(p,from){
  if(p===photo) return; photo=p; Z.s=1;Z.x=0;Z.y=0; renderWorld("product");
  const sel=from&&from.dataset.photoStep?`[data-photo-step="${from.dataset.photoStep}"]`:`[data-photo="${p}"]`;
  $("#w-product "+sel)?.focus({preventScroll:true});
  $("#plate img")?.animate([{opacity:0,transform:"scale(.98)"},{opacity:1,transform:"none"}],{duration:280,easing:"ease-out"});
}
function plateRect(){return $("#plate").getBoundingClientRect();}
function clampZ(){const r=plateRect(),mx=(Z.s-1)*r.width/2,my=(Z.s-1)*r.height/2;Z.x=clamp(Z.x,-mx,mx);Z.y=clamp(Z.y,-my,my);}
function applyZ(smooth){
  const pl=$("#plate"); if(!pl) return; const img=$("img",pl);
  if(Z.s<1.02){Z.s=1;Z.x=0;Z.y=0;} clampZ();
  img.style.transition=smooth?"transform .32s cubic-bezier(.2,.7,.2,1)":"none";
  img.style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;
  img.classList.toggle("shadowed",Z.s===1);
  const on=Z.s>1; pl.classList.toggle("zoomed",on); $("#unzoom").hidden=!on; $("#zoomhint").style.visibility=on?"hidden":"";
}
function zoomTo(s,cx,cy){const r=plateRect();const px=(cx??r.left+r.width/2)-(r.left+r.width/2),py=(cy??r.top+r.height/2)-(r.top+r.height/2);
  s=clamp(s,1,ZMAX);const k=s/Z.s;Z.x=px-(px-Z.x)*k;Z.y=py-(py-Z.y)*k;Z.s=s;}
function resetZoom(smooth){Z.s=1;Z.x=0;Z.y=0;applyZ(smooth);}
function bindPlate(){
  const pl=$("#plate"); if(!pl) return; Z.s=1;Z.x=0;Z.y=0;
  const pts=new Map(); let g=null;
  const mid=()=>{const a=[...pts.values()];return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};};
  /* exit is handled on pointerup as well as click: some touch browsers drop the click after a pan */
  $("#unzoom").addEventListener("pointerup",e=>{ e.stopPropagation(); resetZoom(true); });
  pl.addEventListener("pointerdown",e=>{
    if(e.target.closest("#unzoom")) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    try{pl.setPointerCapture(e.pointerId);}catch(_){}
    if(pts.size===1) g={type:"one",x0:e.clientX,y0:e.clientY,zx:Z.x,zy:Z.y,moved:false,t:performance.now()};
    if(pts.size===2){const m=mid(); g={type:"pinch",m0:m,s0:Z.s,zx:Z.x,zy:Z.y};}
  });
  pl.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId)||!g) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(g.type==="pinch"&&pts.size===2){ const m=mid(); Z.s=g.s0;Z.x=g.zx;Z.y=g.zy; zoomTo(g.s0*m.d/(g.m0.d||1),g.m0.x,g.m0.y); Z.x+=m.x-g.m0.x; Z.y+=m.y-g.m0.y; applyZ(false); e.preventDefault(); return; }
    if(g.type==="one"){ const dx=e.clientX-g.x0, dy=e.clientY-g.y0; if(Math.hypot(dx,dy)>6) g.moved=true;
      if(Z.s>1&&g.moved){ pl.classList.add("dragging"); Z.x=g.zx+dx; Z.y=g.zy+dy; applyZ(false); } }
  });
  const end=e=>{
    if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId); pl.classList.remove("dragging");
    if(!g) return;
    if(g.type==="pinch"){ if(pts.size===0){ g=null; if(Z.s<1.08) resetZoom(true); } else { const [k,v]=[...pts.entries()][0]; g={type:"one",x0:v.x,y0:v.y,zx:Z.x,zy:Z.y,moved:true,t:0}; } return; }
    if(g.type==="one"&&pts.size===0&&e.type==="pointerup"){
      const dx=e.clientX-g.x0, dy=e.clientY-g.y0;
      if(!g.moved&&performance.now()-g.t<450){ if(Z.s>1) resetZoom(true); else { zoomTo(ZTAP,e.clientX,e.clientY); applyZ(true); } }
      else if(Z.s===1&&Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.4){ const fwd=(dx<0)!==(lang==="ar"); setPhoto(PH[(PH.indexOf(photo)+(fwd?1:2))%3],null); }
      g=null;
    }
  };
  pl.addEventListener("pointerup",end); pl.addEventListener("pointercancel",end);
  pl.addEventListener("wheel",e=>{ if(!e.ctrlKey&&Z.s===1) return; e.preventDefault();
    if(e.ctrlKey){ zoomTo(Z.s*Math.exp(-e.deltaY*.01),e.clientX,e.clientY); } else { Z.x-=e.deltaX; Z.y-=e.deltaY; } applyZ(false); },{passive:false});
  pl.addEventListener("keydown",e=>{
    const k=e.key, step=48;
    if(k==="Enter"||k===" "){ e.preventDefault(); if(Z.s>1) resetZoom(true); else { zoomTo(ZTAP); applyZ(true);} }
    else if(k==="+"||k==="="){ e.preventDefault(); zoomTo(Z.s+.5); applyZ(true); }
    else if(k==="-"){ e.preventDefault(); zoomTo(Z.s-.5); applyZ(true); }
    else if(Z.s>1&&k.startsWith("Arrow")){ e.preventDefault(); if(k==="ArrowLeft")Z.x+=step; if(k==="ArrowRight")Z.x-=step; if(k==="ArrowUp")Z.y+=step; if(k==="ArrowDown")Z.y-=step; applyZ(true); }
  });
}

/* faq */
function setQ(i){
  q=(i===q&&!isWide())?-1:i;
  renderWorld("faq"); $("#faq-panel")?.classList.add("fresh");
  $(`#faq-q-${i}`)?.focus({preventScroll:true});
}

document.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target, n=$("#form-note");
  const bad=[...f.elements].find(el=>el.required&&!el.checkValidity());
  if(bad){ bad.focus(); bad.reportValidity&&bad.reportValidity(); return; }
  if(n){ n.textContent=U().contact.sent; }   // no service connected: never report a successful send
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(Z.s>1&&targetView()==="product"){ resetZoom(true); $("#plate")?.focus({preventScroll:true}); return; } goHome("Escape key"); return; }
  if(NAV.phase==="world"&&NAV.id==="how"&&(e.key==="ArrowLeft"||e.key==="ArrowRight")&&!e.target.closest("input,textarea,select,#plate")){
    const fwd=(e.key==="ArrowLeft")===(lang==="ar"); setStep(step+(fwd?1:-1),null); e.preventDefault();
  }
});
/* swipe between steps */
let sw=null;
document.addEventListener("pointerdown",e=>{ if(targetView()==="how"&&e.target.closest("#ill")) sw={x:e.clientX,y:e.clientY}; });
document.addEventListener("pointerup",e=>{ if(!sw) return; const dx=e.clientX-sw.x, dy=e.clientY-sw.y; sw=null;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.3){ const fwd=(dx<0)!==(lang==="ar"); setStep(step+(fwd?1:-1),null);} });
document.addEventListener("pointercancel",()=>sw=null);

/* breakpoint change: re-render the parts whose structure depends on it */
WIDE.addEventListener("change",()=>{ syncTabStops(); renderWorld("faq"); });
addEventListener("resize",()=>{ if(Z.s>1) applyZ(false); });

/* language: keeps step, angle, open question, scroll and any form values */
$("#lang").addEventListener("click",()=>{
  finishActive();
  const cur=view, sc=cur!=="home"?$("#w-"+cur).scrollTop:$("#home").scrollTop;
  formKeep=readForm()||formKeep;
  lang=lang==="ar"?"en":"ar";
  const r=document.documentElement; r.lang=lang; r.dir=lang==="ar"?"rtl":"ltr";
  document.title=lang==="ar"?"Warmhug — دفء يشبه الحضن":"Warmhug — Herbal warming patches";
  renderAll();
  const hm=$("#home"); hm.style.display="none"; void hm.offsetHeight; hm.style.display="";
  (cur!=="home"?$("#w-"+cur):hm).scrollTop=sc;
  $("#lang").focus({preventScroll:true});
});


/* ---------- boot ---------- */
document.documentElement.lang="ar"; document.documentElement.dir="rtl";
renderAll();
$("#shot").classList.add("in");
$$("#spots .spot").forEach(s=>s.classList.add("enter-in"));
setTimeout(()=>$$(".spot.enter-in").forEach(s=>s.classList.remove("enter-in")),1900);
$$(".world").forEach(w=>w.inert=true);
const start=(location.hash||"").slice(1);
/* opened on a section link: give it a home entry underneath, so "back" returns to the scene instead of leaving the site */
log("boot",{build:BUILD,link:start||"-"});
if(W[start]){ stamp(histHome(),BASE,false); stamp({wh:1,id:start,fromHome:true},"#"+start,true); enter(start,null,"boot",true); }
else stamp(histHome(),BASE,false);
})();
</script>
